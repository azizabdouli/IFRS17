<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Inscription IFRS17</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Inscription IFRS17</h1>
    <p>Ce formulaire teste directement l'API backend</p>

    <form id="registerForm">
        <div class="form-group">
            <label>Prénom *</label>
            <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
            <label>Nom *</label>
            <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Mot de passe * (min 6 caractères)</label>
            <input type="password" id="password" required minlength="6">
        </div>

        <div class="form-group">
            <label>Société</label>
            <input type="text" id="company" value="BNA">
        </div>

        <div class="form-group">
            <label>Département</label>
            <input type="text" id="department" value="Assurance">
        </div>

        <button type="submit">✅ Créer le Compte</button>
    </form>

    <div id="result" class="result"></div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';

            // Récupérer les données du formulaire
            const data = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: 'analyste_ifrs17',
                company: document.getElementById('company').value,
                department: document.getElementById('department').value
            };

            console.log('📤 Envoi des données:', data);

            try {
                const response = await fetch('http://localhost:8001/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('📥 Réponse:', result);

                resultDiv.style.display = 'block';
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Inscription réussie!</h3>
                        <p><strong>Email:</strong> ${result.email}</p>
                        <p><strong>Nom complet:</strong> ${result.full_name}</p>
                        <p><strong>Rôle:</strong> ${result.role}</p>
                        <p><strong>Niveau:</strong> ${result.level}</p>
                        <p>Vous pouvez maintenant vous connecter!</p>
                    `;
                    document.getElementById('registerForm').reset();
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Erreur</h3>
                        <p>${result.detail || 'Une erreur est survenue'}</p>
                    `;
                }
            } catch (error) {
                console.error('❌ Erreur:', error);
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Erreur de connexion</h3>
                    <p>Impossible de contacter le serveur backend.</p>
                    <p>Vérifiez que le backend est démarré sur http://localhost:8001</p>
                    <p><small>Erreur: ${error.message}</small></p>
                `;
            }
        });
    </script>
</body>
</html>
